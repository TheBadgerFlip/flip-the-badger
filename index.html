<style>
/* PROTECTED INTELLECTUAL PROPERTY — UNAUTHORISED COPYING PROHIBITED */
:root{--black:#050505;--deep-red:#CF0000;--luxury-red:#9E0000;--gold:#D4AF37;--gold-light:#F4E4BC;--gold-dark:#B8860B;--velvet:#1A1A1A;--text-light:#E8E8E8;--shadow-gold:0 0 30px rgba(212,175,55,.25);--box-h:164px;--box-w:110px;--box-d:44px}
*{margin:0;padding:0;box-sizing:border-box;font-family:Georgia,'Times New Roman',serif}
html{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none}
body{background:radial-gradient(ellipse at top,#1A1A1A 0%,#050505 70%);color:var(--text-light);line-height:1.7;min-height:100vh}
.luxury-bg{position:fixed;top:0;left:0;width:100%;height:100%;background-image:radial-gradient(circle at 20% 30%,rgba(212,175,55,.03) 0%,transparent 50%),radial-gradient(circle at 80% 70%,rgba(207,0,0,.05) 0%,transparent 50%);z-index:-2;pointer-events:none}
nav{background:linear-gradient(180deg,rgba(0,0,0,.95),rgba(26,26,26,.9));padding:14px 15px;position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(212,175,55,.2);backdrop-filter:blur(10px)}
.nav-container{max-width:960px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.nav-link{color:var(--gold-light);text-decoration:none;padding:10px 18px;border-radius:4px;font-weight:600;font-size:15px;letter-spacing:.5px;transition:all .3s ease;cursor:pointer;border:1px solid transparent;position:relative;z-index:10;-webkit-user-select:none;user-select:none}
.nav-link:hover,.nav-link.active{color:var(--gold);border-color:var(--gold);background:rgba(212,175,55,.08)}
section{max-width:960px;margin:0 auto;padding:40px 20px;display:none;animation:fadeIn .6s ease-out;position:relative;z-index:1}
section.active{display:block}
h1{font-size:42px;text-align:center;margin-bottom:10px;color:var(--gold);font-weight:bold;letter-spacing:2px;text-transform:uppercase;text-shadow:0 0 20px rgba(212,175,55,.3)}
h2{font-size:22px;margin:30px 0 15px;color:var(--gold);border-bottom:1px solid rgba(212,175,55,.25);padding-bottom:10px;letter-spacing:1px}
.subtitle{text-align:center;font-size:18px;color:var(--gold-light);margin-bottom:40px;font-style:italic}
.hero-wrapper{position:relative;text-align:center;margin:20px 0 50px;perspective:600px;height:220px}
.flip-container{width:200px;height:200px;margin:0 auto;perspective:1000px}
.flipper{position:relative;width:var(--box-w);height:var(--box-h);transform-style:preserve-3d;animation:fullFlip 6s infinite ease-in-out;margin:0 auto}
.box-face{position:absolute;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid var(--gold);box-shadow:inset 0 0 20px rgba(0,0,0,.5),0 0 15px rgba(212,175,55,.2);backface-visibility:hidden;background:linear-gradient(145deg,#2A2A2A,#151515)}
.face-top{width:var(--box-w);height:var(--box-h);transform:rotateX(0deg) translateZ(calc(var(--box-d)/2))}
.face-top .score{color:#4CAF50;font-size:32px;font-weight:bold}
.face-top .icon{font-size:36px;margin-bottom:4px}
.face-bottom{width:var(--box-w);height:var(--box-h);transform:rotateX(180deg) translateZ(calc(var(--box-d)/2))}
.face-bottom .score{color:#8B0000;font-size:28px;font-weight:bold}
.face-bottom .icon{font-size:28px;margin-bottom:4px}
.face-front{width:var(--box-w);height:var(--box-d);transform:rotateX(90deg) translateZ(calc(var(--box-h)/2))}
.face-front .score{color:#1565C0;font-size:26px;font-weight:bold}
.face-front .icon{font-size:26px;margin-bottom:3px}
.face-back{width:var(--box-w);height:var(--box-d);transform:rotateX(-90deg) translateZ(calc(var(--box-h)/2))}
.face-back .score{color:#1565C0;font-size:26px;font-weight:bold}
.face-back .icon{font-size:26px;margin-bottom:3px}
.face-left{width:var(--box-d);height:var(--box-h);transform:rotateY(-90deg) translateZ(calc(var(--box-w)/2))}
.face-left .score{color:var(--gold);font-size:28px;font-weight:bold}
.face-left .icon{font-size:28px;margin-bottom:4px}
.face-right{width:var(--box-d);height:var(--box-h);transform:rotateY(90deg) translateZ(calc(var(--box-w)/2))}
.face-right .score{color:var(--gold);font-size:28px;font-weight:bold}
.face-right .icon{font-size:28px;margin-bottom:4px}
@keyframes fullFlip{0%{transform:rotateX(0deg) rotateY(0deg)}16%{transform:rotateX(180deg) rotateY(60deg)}33%{transform:rotateX(360deg) rotateY(120deg)}50%{transform:rotateX(540deg) rotateY(180deg)}66%{transform:rotateX(720deg) rotateY(240deg)}83%{transform:rotateX(900deg) rotateY(300deg)}100%{transform:rotateX(1080deg) rotateY(360deg)}}
.card{background:linear-gradient(135deg,rgba(26,26,26,.9),rgba(10,10,10,.95));border-radius:12px;padding:30px;margin:20px 0;border:1px solid rgba(212,175,55,.15);box-shadow:var(--shadow-gold)}
.btn{display:inline-block;padding:16px 36px;background:linear-gradient(135deg,var(--gold-dark),var(--gold),var(--gold-dark));color:var(--black);border:none;border-radius:6px;font-weight:bold;font-size:18px;cursor:pointer;transition:all .3s ease;text-decoration:none;letter-spacing:1px;text-transform:uppercase;box-shadow:0 4px 15px rgba(212,175,55,.3);text-align:center;position:relative;z-index:10;-webkit-user-select:none;user-select:none}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(212,175,55,.4)}
.btn:active{transform:translateY(0)}
.btn.red{background:linear-gradient(135deg,var(--luxury-red),var(--deep-red),var(--luxury-red));color:white;box-shadow:0 4px 15px rgba(207,0,0,.3)}
.btn.red:hover{box-shadow:0 6px 20px rgba(207,0,0,.4)}
.btn.large{padding:20px 45px;font-size:20px}
.feature-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin:30px 0}
.feature-card{background:linear-gradient(135deg,rgba(35,35,35,.8),rgba(15,15,15,.9));padding:25px 20px;border-radius:10px;text-align:center;border:1px solid rgba(212,175,55,.12)}
.feature-card .icon{font-size:36px;margin-bottom:10px}
.feature-card h3{font-size:18px;margin-bottom:8px;color:var(--gold)}
.feature-card p{font-size:14px;color:#999;margin-bottom:15px}
.install-banner{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#1A1A1A,#0A0A0A);padding:15px 25px;border-radius:10px;box-shadow:0 0 30px rgba(212,175,55,.25);z-index:200;display:none;max-width:360px;border:1px solid rgba(212,175,55,.25)}
.install-banner.show{display:flex;gap:15px;align-items:center;flex-wrap:wrap}
.install-btn{padding:10px 16px;border-radius:6px;border:none;font-weight:bold;cursor:pointer}
.install-btn.ok{background:var(--gold);color:black}
.install-btn.later{background:#333;color:#999}
.leaderboard{width:100%;border-collapse:separate;border-spacing:0 6px;margin-top:15px}
.leaderboard th{color:var(--gold);text-align:left;padding:10px 8px;font-size:13px;text-transform:uppercase;border-bottom:1px solid rgba(212,175,55,.15)}
.leaderboard th:nth-child(1){width:15%;text-align:center}
.leaderboard th:nth-child(2){width:70%}
.leaderboard th:nth-child(3){width:15%;text-align:right}
.leaderboard td{background:rgba(20,20,20,.6);padding:12px 10px;font-size:15px}
.leaderboard tr td:first-child{border-radius:8px 0 0 8px;font-weight:bold;color:var(--gold);text-align:center}
.leaderboard tr td:last-child{border-radius:0 8px 8px 0;font-weight:bold;color:var(--gold);text-align:right}
.leaderboard .gold td{background:linear-gradient(90deg,rgba(212,175,55,.15),rgba(20,20,20,.4))}
.leaderboard .silver td{background:linear-gradient(90deg,rgba(192,192,192,.1),rgba(20,20,20,.4))}
.leaderboard .bronze td{background:linear-gradient(90deg,rgba(205,127,50,.12),rgba(20,20,20,.4))}
.game-container{background:linear-gradient(135deg,rgba(26,26,26,.9),rgba(10,10,10,.95));border-radius:12px;padding:25px;border:1px solid rgba(212,175,55,.15)}
.note{background:rgba(207,0,0,.1);border-left:3px solid var(--deep-red);padding:15px;margin-bottom:20px;border-radius:0 8px 8px 0;color:#ddd}
.game-btn{padding:12px 10px;border-radius:8px;border:none;font-size:15px;font-weight:bold;cursor:pointer;margin:5px;width:calc(50% - 10px);position:relative;z-index:10;-webkit-user-select:none;user-select:none}
.game-btn.red{background:linear-gradient(135deg,#9E0000,#CF0000);color:white}
.game-btn.green{background:linear-gradient(135deg,#2E7D32,#4CAF50);color:white}
.game-btn.gray{background:#333;color:#ccc}
.score-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}
.score-btn{padding:18px 8px;font-size:18px;border-radius:10px;border:2px solid transparent;cursor:pointer;transition:all .2s ease;background:#1A1A1A;color:white;position:relative;z-index:10;-webkit-user-select:none;user-select:none}
.score-btn:hover{border-color:var(--gold);box-shadow:0 0 15px rgba(212,175,55,.2)}
.score-btn:active{transform:scale(.95)}
.score-btn.zero{border-color:#8B0000;background:linear-gradient(135deg,#2A0000,#1A0000)}
.score-btn.one{border-color:#4CAF50;background:linear-gradient(135deg,#0A2A0A,#051A05)}
.score-btn.five{border-color:#1565C0;background:linear-gradient(135deg,#0A1A2A,#05101A)}
.score-btn.ten{border-color:var(--gold);background:linear-gradient(135deg,#2A2510,#1A1508);color:var(--gold)}
.hidden{display:none!important}
.status{padding:15px;border-radius:8px;margin:12px 0;background:rgba(255,255,255,.05);border-left:3px solid #555}
.status.lose{background:rgba(207,0,0,.1);border-left-color:var(--deep-red)}
.status.win{background:rgba(212,175,55,.15);border-left-color:var(--gold);color:var(--gold)}
input{padding:14px;border-radius:8px;border:1px solid #444;background:#111;color:white;font-size:16px;-webkit-user-select:text;user-select:text}
footer{text-align:center;padding:40px 25px;color:#555;font-size:13px;border-top:1px solid rgba(212,175,55,.1);margin-top:30px}
footer .copyright{color:#777;margin-top:10px;font-size:12px}
@keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:480px){:root{--box-h:130px;--box-w:88px;--box-d:35px}h1{font-size:28px}.btn.large{width:100%}.score-grid{grid-template-columns:repeat(2,1fr)}}
</style>
